<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="glow-purple" cx="80%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="20%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.04)"/>
    </pattern>

    <!-- Cyan glow filter -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="#050505"/>

  <!-- Dot grid -->
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Ambient glows -->
  <rect width="1200" height="630" fill="url(#glow-purple)"/>
  <rect width="1200" height="630" fill="url(#glow-cyan)"/>

  <!-- Left cyan accent bar -->
  <rect x="72" y="80" width="4" height="470" fill="#22d3ee" opacity="0.9"/>

  <!-- Ghost large W — decorative, top-right -->
  <text
    x="1060" y="480"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="620"
    font-weight="700"
    fill="none"
    stroke="rgba(255,255,255,0.03)"
    stroke-width="1"
    text-anchor="middle"
  >W</text>

  <!-- Kicker label -->
  <text
    x="104" y="178"
    font-family="'Courier New', Courier, monospace"
    font-size="18"
    letter-spacing="6"
    fill="#a855f7"
    text-transform="uppercase"
  >PORTFOLIO · 2026</text>

  <!-- Main name -->
  <text
    x="100" y="330"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="148"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="-2"
  >Will Boone</text>

  <!-- Underline accent -->
  <line x1="100" y1="356" x2="820" y2="356" stroke="#22d3ee" stroke-width="1.5" opacity="0.35"/>

  <!-- Subtitle -->
  <text
    x="102" y="418"
    font-family="'Courier New', Courier, monospace"
    font-size="26"
    fill="rgba(255,255,255,0.45)"
    letter-spacing="1"
  >Software Developer  ·  AI + Web Platforms</text>

  <!-- Tech stack tags -->
  <!-- Next.js tag -->
  <rect x="100" y="462" width="94" height="28" rx="3" fill="none" stroke="rgba(34,211,238,0.3)" stroke-width="1"/>
  <text x="147" y="480" font-family="'Courier New', Courier, monospace" font-size="12" fill="#22d3ee" letter-spacing="1" text-anchor="middle">Next.js</text>

  <!-- TypeScript tag -->
  <rect x="206" y="462" width="106" height="28" rx="3" fill="none" stroke="rgba(34,211,238,0.3)" stroke-width="1"/>
  <text x="259" y="480" font-family="'Courier New', Courier, monospace" font-size="12" fill="#22d3ee" letter-spacing="1" text-anchor="middle">TypeScript</text>

  <!-- LLM / RAG tag -->
  <rect x="324" y="462" width="94" height="28" rx="3" fill="none" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
  <text x="371" y="480" font-family="'Courier New', Courier, monospace" font-size="12" fill="#a855f7" letter-spacing="1" text-anchor="middle">LLM · RAG</text>

  <!-- PostgreSQL tag -->
  <rect x="430" y="462" width="112" height="28" rx="3" fill="none" stroke="rgba(34,211,238,0.3)" stroke-width="1"/>
  <text x="486" y="480" font-family="'Courier New', Courier, monospace" font-size="12" fill="#22d3ee" letter-spacing="1" text-anchor="middle">PostgreSQL</text>

  <!-- Domain — bottom right -->
  <text
    x="1128" y="566"
    font-family="'Courier New', Courier, monospace"
    font-size="20"
    fill="#22d3ee"
    opacity="0.7"
    text-anchor="end"
    filter="url(#cyan-glow)"
  >willboone.dev</text>

  <!-- Bottom border line -->
  <line x1="72" y1="552" x2="1128" y2="552" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
